services:
  backend:
    build: ./backend
    expose:
      - "8000"
    env_file: .env
    environment:
      # The speech models (Vosk 168 MB, Whisper 464 MB) live in the "models"
      # volume, not under ./backend: reading files this size through the
      # Windows -> VM bind mount hung the process in uninterruptible disk wait
      # several times. See services/stt.py.
      MODELS_DIR: /opt/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - models:/opt/models
    healthcheck:
      # The ASGI app can't accept any TCP connection at all until model
      # loading (AASIST-L, Resemblyzer, Vosk) finishes inside the lifespan
      # startup hook -- confirmed live that a request during that window gets
      # an instant connection-refused, not a slow response. That makes /docs
      # a reliable readiness probe: it only succeeds once startup is truly
      # done. start_period is generous because cold start on this bind-mounted
      # dev setup has been observed to take several minutes (Windows/WSL2
      # bind-mount I/O for the Vosk model's many small files).
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 600s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: voiceauth
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d voiceauth"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
  models:

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # a location with any add_header of its own doesn't inherit the ones
        # nginx auto-loads from conf.d at the http level, so this is included
        # explicitly rather than left to that -- see security-headers.conf
        include /etc/nginx/conf.d/security-headers.conf;

        # nginx's own default (1m) is stricter than the backend's 5MB audio-size
        # check, so a legitimate recording between 1-5MB was silently rejected
        # here with a raw HTML 413 page before ever reaching the backend's JSON
        # error response. Sized slightly above 5MB for multipart/form-data
        # overhead (boundary markers, headers) around the raw audio bytes.
        client_max_body_size 6m;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # ./frontend is bind-mounted whole into the html root above, so nginx.conf
    # and security-headers.conf itself are physically inside the docroot too --
    # confirmed live that both were servable as plain static files without
    # this. A regex location takes priority over the prefix location / above
    # regardless of the order they're written in, so this still applies to
    # every .conf file in the tree, present or future.
    location ~* \.conf$ {
        deny all;
    }
}

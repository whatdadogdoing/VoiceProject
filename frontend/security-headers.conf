# Included from both location blocks in nginx.conf: nginx only inherits
# add_header from the server block into a location that has none of its own,
# so any location that adds a header of its own (Cache-Control below, in
# location /) has to repeat all of these too or silently drop them -- an
# include is used instead of pasting this block twice so the two copies can't
# drift apart. Also included under /api/ because nginx itself can answer
# directly there with an HTML error page (e.g. the 413 from
# client_max_body_size in nginx.conf) without ever reaching the backend.
#
#   X-Content-Type-Options: stops the browser guessing a different content
#     type than the one served (MIME-sniffing) and running it as something
#     else, e.g. as script.
#   X-Frame-Options / frame-ancestors: refuses to be framed by another site at
#     all (clickjacking); the two exist for the same purpose on browsers old
#     and new, kept together rather than dropping either.
#   Referrer-Policy: this is a login page, so there is no legitimate reason
#     for its URL to be sent anywhere as a referrer.
#   Content-Security-Policy: script-src is the one doing the real work (only
#     frontend/*.js may run, nothing inlined or from elsewhere); the rest just
#     names what the page actually uses so tightening this later doesn't have
#     to be guessed at again --
#       style-src needs 'unsafe-inline' because app.js sets .style.* (the mic
#         level meter, several show/hide toggles) and index.html has a couple
#         of style="display:none" attributes; neither is a realistic
#         injection vector compared to script, so this is the accepted
#         trade-off rather than rewriting them to toggle CSS classes;
#       media-src needs blob: for the two <audio> previews, which play back
#         the just-recorded take via URL.createObjectURL;
#       connect-src/img-src/default-src stay 'self' because every fetch()
#         call and the only images (the inline SVG icons) are same-origin.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

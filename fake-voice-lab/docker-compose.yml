services:
  fakevoice:
    build: .
    init: true  # torch/OpenMP can leave zombie children; a real PID 1 reaps them
    ports:
      - "5001:8000"
    volumes:
      - ./data:/app/data
    environment:
      - AUTH_BACKEND_URL=http://backend:8000

networks:
  default:
    name: voiceproject_default
    external: true
